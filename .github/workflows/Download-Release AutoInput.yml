name: Download+Release AutoInput

on:
  schedule:
    - cron:  '1 0 * * SUN,WED' # Google causes problems sometimes when downloads are too frequent
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: 'schklom/AutoInput-apk'
          ref: 'main' # branch
          token: ${{ secrets.PAT_GITHUB_ACTION }}

      - name: Get apk from Google Drive
        run: |
          filename="AutoInput.Direct.apk"
          echo "filename=${filename}" >> $GITHUB_ENV
          #fileid=${{ secrets.AUTOINPUT_GOOGLE_DRIVE_FILE_ID }}
          #url="https://drive.usercontent.google.com/download?id=${fileid}&export=download&authuser=0&confirm=t"
          
          tasker_page_url=${{ secrets.AUTOINPUT_TASKER_PAGE_LINK }}
          dropbox_url=$(curl --silent "${tasker_page_url}" | grep --perl-regexp --only-matching 'https://.*AutoInput.*?(?=")')
          
          curl -L "${dropbox_url}" -o ${filename}
      
      - name: Store md5 hash of new apk
        run: md5sum "${{ env.filename }}" | cut -d " " -f 1 > hash_new_file
      
      - name: Read current and new hash of apk
        run: |
          # Create hash_current_file if it doesn't exist
          touch hash_current_file
          echo "current_hash=$(cat hash_current_file)" | tee -a $GITHUB_ENV
          echo "new_hash=$(cat hash_new_file)" | tee -a $GITHUB_ENV
      
      - name: Record last update date and update current hash
        if: ${{ env.current_hash != env.new_hash }}
        run: |
          date +%Y-%m-%d_%H-%M > last_update_date
          echo "last_update_date_env=$(cat last_update_date)" >> $GITHUB_ENV
          mv hash_new_file hash_current_file
      
      # https://code.whatever.social/questions/13469147/get-android-apk-file-versionname-or-versioncode-without-installing-apk
      - name: Find version number
        if: ${{ env.current_hash != env.new_hash }}
        run: |
          sudo apt install -y aapt
          ls -alh
          # get versionName string, remove "versionName=, remove "'". This is more readable than lookaheads/lookbehinds
          version=`aapt dump badging ${{ env.filename }} | grep -Po "versionName='.+?'" | sed "s/versionName=//" | sed "s/'//g"`
          echo "version=${version}" >> $GITHUB_ENV
#          unzip -d apk_files ${{ env.filename }}
#          echo "version=$(grep "Version" apk_files/assets/about.html | grep -oP '[0-9\.]+')" >> $GITHUB_ENV
#          rm -rf apk_files
      
      - name: Write tag name
        if: ${{ env.current_hash != env.new_hash }}
        #run: echo "tagname=${{ env.version }}_${{ env.last_update_date_env }}" >> $GITHUB_ENV
        run: |
          ver="${{ env.version }}"
          last_update="${{ env.last_update_date_env }}"
          tagname="${ver}_${last_update}"
          echo "tagname=${tagname}" >> $GITHUB_ENV
      
      - name: Commit and push the change
        if: ${{ env.current_hash != env.new_hash }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update the apk's hash and update date"
          file_pattern: hash_current_file last_update_date
        
      - name: Release apk if hashes are different
        if: ${{ env.current_hash != env.new_hash }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tagname }}
          body: "New version of AutoInput Direct Purchase"
          files: ${{ env.filename }}
          repository: "schklom/AutoInput-apk"
          token: ${{ secrets.PAT_GITHUB_ACTION }}
