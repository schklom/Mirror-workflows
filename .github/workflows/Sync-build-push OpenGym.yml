name: Sync-build-push OpenGym

on:
  # Triggers the workflow on push or pull request events but only for the main branch
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '0 0 * * *'
  push:
    branches:
      - main
    paths:
      - ".github/workflows/Sync-build-push OpenGym.yml"
  
  workflow_dispatch:

env:
  LOCAL_BRANCH: OpenGym
  UPSTREAM_REPO: https://github.com/arvids-unavailable/openGym.git
  UPSTREAM_BRANCH: main

jobs:
  get_commits:
    runs-on: ubuntu-latest
    # https://lannonbr.com/blog/2020-04-16-gh-actions-job-outputs
    outputs:
      # https://github.com/arvids-unavailable/openGym
      LOCAL: ${{ steps.commits.outputs.SETLOCAL }}
      REMOTE: ${{ steps.commits.outputs.SETREMOTE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "${{ env.LOCAL_BRANCH }}"
      - name: set local and remote latest commit as environment variables
        id: commits
        # https://lannonbr.com/blog/2020-04-16-gh-actions-job-outputs
        # https://docs.github.com/en/actions/using-jobs/defining-outputs-for-jobs
        run: |
          echo "SETREMOTE=$(git ls-remote ${{ env.UPSTREAM_REPO }} HEAD | awk '{ print $1 }')" >> $GITHUB_OUTPUT
          echo "SETLOCAL=$(cat last_sync_with_original_repo_commit_id)" >> $GITHUB_OUTPUT
  
  repo_sync:
    needs: [get_commits]
    runs-on: ubuntu-latest
    # https://lannonbr.com/blog/2020-04-16-gh-actions-job-outputs
    if: ${{ needs.get_commits.outputs.LOCAL != needs.get_commits.outputs.REMOTE || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: repo-sync
        uses: wei/git-sync@v3
        with:
          source_repo: "${{ env.UPSTREAM_REPO }}"
          source_branch: "${{ env.UPSTREAM_BRANCH }}"
          destination_repo: "git@github.com:schklom/Mirror-workflows.git"
          destination_branch: "${{ env.LOCAL_BRANCH }}"
          ssh_private_key: ${{ secrets.GITSYNCACTION }}
        # uses: repo-sync/github-sync@v2
        # with:
          # source_repo: "https://github.com/hkalexling/Mango.git"
          # source_branch: "master"
          # destination_branch: "Protonmail-bridge"
          # github_token: ${{ secrets.REPO_SYNC_GITHUB_SYNC_PERSONAL_ACCESS_TOKEN }}
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "${{ env.LOCAL_BRANCH }}"

      # https://github.com/actions/checkout#fetch-only-a-single-file
      - name: Checkout patch
        uses: actions/checkout@v7
        with:
          ref: 'Patch-OpenGym' # branch
          path: patch
          sparse-checkout: |
            patch.bash
          sparse-checkout-cone-mode: false

      - name: Apply patch
        run: |
          file="patch/patch.bash"
          chmod +x "$file"
          . "$file"
          rm -f "$file"
      
      - name: Commit and push the change
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Apply patch
      
      - name: Get most recent commit id on original repo, for next comparison on sync
        run: |
          git ls-remote "${{ env.UPSTREAM_REPO }}" HEAD | awk '{ print $1 }' > last_sync_with_original_repo_commit_id
      
      - name: Commit and push the change
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Add last_sync_with_original_repo_commit_id

  build_push:
    needs: [repo_sync]
    #needs: [get_commits]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "${{ env.LOCAL_BRANCH }}"
      
      # https://github.com/docker/setup-qemu-action#usage
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.4.0
        #with:
          #image: tonistiigi/binfmt:latest
          #platforms: all
          #platforms: arm/v7
      
      # https://github.com/marketplace/actions/docker-setup-buildx
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.3.0
        #with:
          #install: true
      #- name: Available platforms
      #  run: echo ${{ steps.buildx.outputs.platforms }}
      # https://github.com/docker/login-action#docker-hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      # https://github.com/docker/build-push-action#multi-platform-image
      - name: Build and push OpenGym-API
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile
          #platforms: linux/amd64,linux/arm64,linux/riscv64,linux/ppc64le,linux/s390x,linux/386,linux/mips64le,linux/mips64,linux/arm/v7,linux/arm/v6
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            schklom/opengym-api:latest
      
      # https://github.com/docker/build-push-action#multi-platform-image
      - name: Build and push OpenGym-Web
        uses: docker/build-push-action@v7
        with:
          # ./web/Dockerfile doesn't exist, but ./Dockerfile does
          context: ./
          file: ./Dockerfile
          #platforms: linux/amd64,linux/arm64,linux/riscv64,linux/ppc64le,linux/s390x,linux/386,linux/mips64le,linux/mips64,linux/arm/v7,linux/arm/v6
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            schklom/opengym-web:latest
      
