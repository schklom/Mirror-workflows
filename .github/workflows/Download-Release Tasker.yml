name: Download+Release Tasker

on:
  schedule:
    - cron:  '3 0 * * SUN,WED' # Google causes problems sometimes when downloads are too frequent
  push:
    paths:
      - .github/workflows/Download-Release Tasker.yml
  workflow_dispatch:
    inputs:
      ignore_hash:
        default: false
        description: Ignore if the hash is new or not
        required: true
        type: boolean

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: 'schklom/Tasker-apk'
          ref: 'main' # branch
          token: ${{ secrets.PAT_GITHUB_ACTION }}

      - name: Get apk
        run: |
          filename="Tasker.Direct.apk"
          echo "filename=${filename}" >> $GITHUB_ENV

          # Old Google Drive link
          #fileid=${{ secrets.TASKER_GOOGLE_DRIVE_FILE_ID }}
          #url="https://drive.usercontent.google.com/download?id=${fileid}&export=download&authuser=0&confirm=t"
          #curl -L "${url}=${fileid}" -o ${filename}

          # Forecefully update CAs to prevent expired certificates in curl commands
          sudo apt update
          sudo apt install --reinstall -y ca-certificates
          sudo update-ca-certificates --fresh
          
          tasker_page_url=${{ secrets.AUTOINPUT_TASKER_PAGE_LINK }}
          dropbox_url=$(curl --silent "${tasker_page_url}" | grep --only-matching '".*dropbox.*"' | tr -d '"')
          
          echo "Got APK URL"
          curl -sSL "${url}" -o ${filename}
      
      - name: Store md5 hash of new apk
        run: md5sum "${{ env.filename }}" | cut -d " " -f 1 > hash_new_file
      
      - name: Read current and new hash of apk
        run: |
          # Create hash_current_file if it doesn't exist
          touch hash_current_file
          echo "current_hash=$(cat hash_current_file)" | tee -a $GITHUB_ENV
          echo "new_hash=$(cat hash_new_file)" | tee -a $GITHUB_ENV
      
      - name: Record last update date and update current hash
        if: env.current_hash != env.new_hash || inputs.ignore_hash == true
        run: |
          date +%Y-%m-%d_%H-%M > last_update_date
          echo "last_update_date_env=$(cat last_update_date)" | tee -a $GITHUB_ENV
          mv hash_new_file hash_current_file
      
      # https://code.whatever.social/questions/13469147/get-android-apk-file-versionname-or-versioncode-without-installing-apk
      - name: Find version number
        if: env.current_hash != env.new_hash || inputs.ignore_hash == true
        run: |
          sudo apt install -y aapt
          ls -alh
          # get versionName string, remove "versionName=, remove "'". This is more readable than lookaheads/lookbehinds
          version=`aapt dump badging ${{ env.filename }} | grep -Po "versionName='.+?'" | sed "s/versionName=//" | tr -d "'"`
          echo "version=${version}" | tee -a $GITHUB_ENV
#          unzip -d apk_files ${{ env.filename }}
#          echo "version=$(grep "Version" apk_files/assets/about.html | grep -oP '[0-9\.]+')" >> $GITHUB_ENV
#          rm -rf apk_files
      
      - name: Write tag name
        if: env.current_hash != env.new_hash || inputs.ignore_hash == true
        #run: echo "tagname=${{ env.version }}_${{ env.last_update_date_env }}" >> $GITHUB_ENV
        run: |
          ver="${{ env.version }}"
          last_update="${{ env.last_update_date_env }}"
          tagname="${ver}_${last_update}"
          echo "tagname=${tagname}" | tee -a $GITHUB_ENV
      
      - name: Commit and push the change
        if: env.current_hash != env.new_hash || inputs.ignore_hash == true
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update the apk's hash and update date"
          file_pattern: hash_current_file last_update_date
        
      - name: Release apk if hashes are different
        if: env.current_hash != env.new_hash || inputs.ignore_hash == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tagname }}
          body: "New version of Tasker Direct Purchase"
          files: ${{ env.filename }}
          repository: "schklom/Tasker-apk"
          token: ${{ secrets.PAT_GITHUB_ACTION }}
