# gitea.com has no Discussions, so questions and ideas are issues here — labelled, so they
# are not mistaken for agreed-on work. Blank issues stay off: the forms ask for the two
# things that otherwise cost a round-trip every time (how it is running, and RP_ID/ORIGIN).
blank_issues_enabled: false
contact_links:
  - name: Self-hosting guide
    url: https://gitea.com/DuarteSantos/openGym/src/branch/main/docs/SELF_HOSTING.md
    about: Passkey login failing, reverse proxies, HTTPS, Docker — most login trouble is an RP_ID/ORIGIN mismatch and is answered here.
  - name: Contributing guide
    url: https://gitea.com/DuarteSantos/openGym/src/branch/main/CONTRIBUTING.md
    about: Project layout, dev setup and guidelines before you open a PR.
  - name: Changelog
    url: https://gitea.com/DuarteSantos/openGym/src/branch/main/CHANGELOG.md
    about: What changed in each release, newest first.
