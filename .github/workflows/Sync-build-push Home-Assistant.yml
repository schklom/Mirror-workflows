name: Sync-build-push Home-Assistant

on:
  push:
    paths: .github/workflows/Sync-build-push Home-Assistant.yml
  schedule:
    - cron:  '0 0 * * *'
  workflow_dispatch:

env:
  LOCAL_BRANCH: Home-Assistant-Dockerfile
  UPSTREAM_REPO: https://github.com/home-assistant/core
  UPSTREAM_BRANCH: refs/heads/master

jobs:
  get_commits:
    runs-on: ubuntu-latest
    # https://lannonbr.com/blog/2020-04-16-gh-actions-job-outputs
    outputs:
      LOCAL: ${{ steps.commits.outputs.SETLOCAL }}
      REMOTE: ${{ steps.commits.outputs.SETREMOTE }} 
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "${{ env.LOCAL_BRANCH }}"
      - name: set local and remote latest commit as environment variables
        id: commits
        # https://lannonbr.com/blog/2020-04-16-gh-actions-job-outputs
        # https://docs.github.com/en/actions/using-jobs/defining-outputs-for-jobs
        run: |
          echo "SETREMOTE=$(git ls-remote ${{ env.UPSTREAM_REPO }} ${{ env.UPSTREAM_BRANCH }} | awk '{ print $1 }')" >> $GITHUB_OUTPUT
          echo "SETLOCAL=$(cat last_sync_with_original_repo_commit_id)" | tee -a $GITHUB_OUTPUT
  
  repo_sync:
    needs: [get_commits]
    runs-on: ubuntu-latest
    # https://lannonbr.com/blog/2020-04-16-gh-actions-job-outputs
    if: needs.get_commits.outputs.LOCAL != needs.get_commits.outputs.REMOTE || github.event_name == 'workflow_dispatch'
    steps:
      # - name: repo-sync
        # uses: wei/git-sync@v3
        # with:
          # source_repo: "https://github.com/home-assistant/core"
          # source_branch: "master"
          # destination_repo: "git@github.com:schklom/Mirror-workflows.git"
          # destination_branch: "Home-Assistant"
          # ssh_private_key: ${{ secrets.GITSYNCACTION }}
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "${{ env.LOCAL_BRANCH }}"
      - name: get most recent commit id on original repo, for next comparison on sync
        run: printf "%s" "${{ needs.get_commits.outputs.REMOTE }}" > last_sync_with_original_repo_commit_id
      - name: Commit and push the change
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Add last_sync_with_original_repo_commit_id

  build_push:
    needs: [repo_sync]
    #needs: [get_commits]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "${{ env.LOCAL_BRANCH }}"
      # https://github.com/docker/setup-qemu-action#usage
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        #with:
          #image: tonistiigi/binfmt:latest
          #platforms: all
          #platforms: arm/v7
      # https://github.com/marketplace/actions/docker-setup-buildx
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.4.1
        #with:
          #install: true
      #- name: Available platforms
      #  run: echo ${{ steps.buildx.outputs.platforms }}
      # https://github.com/docker/login-action#docker-hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # https://github.com/docker/build-push-action#multi-platform-image
      - name: Build and push ${{ env.LOCAL_BRANCH }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          #platforms: linux/amd64,linux/arm64,linux/riscv64,linux/ppc64le,linux/s390x,linux/386,linux/mips64le,linux/mips64,linux/arm/v7,linux/arm/v6
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            schklom/home-assistant:latest
