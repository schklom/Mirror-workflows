# Same suite as .github/workflows/test.yml, run by gitea.com's Actions runners.
# The GitHub copy is kept for the day that account comes back; this one is what
# actually gates contributions today.
name: Tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'mcp/**'
      - '.gitea/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'mcp/**'
      - '.gitea/workflows/test.yml'
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # node:22-alpine in web/Dockerfile and api/Dockerfile — CI must match production.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
